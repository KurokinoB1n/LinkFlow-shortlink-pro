
services:
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: sl-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: sl-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 修复 JDK 在 Docker 下检测 cgroup v2 时 NPE，导致 StoreUtil 初始化失败、消费者无法拉取消息
      # 同时限制 broker JVM 内存（默认 8G，云主机 8G 会 OOM）
      JAVA_OPT_EXT: "-XX:-UseContainerSupport -Xms1g -Xmx1g -Xmn512m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.7/conf/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-4.9.7/conf/broker.conf
  # ==================== MySQL ====================
  mysql:
    image: mysql:5.7.36
    container_name: sl-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+8:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: sl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.1.1
    container_name: sl-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"   # HTTP API + Console
      - "9848:9848"   # gRPC 客户端端口（Nacos 2.x 必须开放！）
      - "9849:9849"   # gRPC 服务端端口
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==================== 短链接聚合服务 ====================
  shortlink-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        MODULE: aggregation
    container_name: sl-app
    restart: unless-stopped
    ports:
      - "8001:8001"   # admin 端口
      - "8002:8002"   # project 端口
      - "8003:8003"
    volumes:
      - ./app/shardingsphere-config-docker.yaml:/app/config/shardingsphere-config-docker.yaml:ro
    environment:
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
      MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: "always"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:shardingsphere:absolutepath:/app/config/shardingsphere-config-docker.yaml
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: nacos
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: nacos
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASSWORD}
      NACOS_ADDR: nacos:8848
      TZ: Asia/Shanghai
      SHORTLINK_FLOWLIMIT_ENABLE: "false"
      # v2：域名改为服务器公网 IP（避免未备案域名的 ICP 拦截；短链地址形如 http://39.96.211.83:8003/xxx）
      SHORT_LINK_DOMAIN_DEFAULT: "39.96.211.83:8003"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ==================== API 网关 ====================
  shortlink-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        MODULE: gateway
    container_name: sl-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: docker,aggregation
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: nacos
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: nacos
      NACOS_ADDR: nacos:8848
      TZ: Asia/Shanghai
      REDIS_HOST: sl-redis
      REDIS_PORT: "6379"
      REDIS_PASS: ${REDIS_PASSWORD}
    depends_on:
      shortlink-app:
        condition: service_started
      nacos:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
